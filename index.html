        lineOfGridBeat(playing ? lastHeardBeat : pausedGridBeat, playing ? activeBpb : beatsPerBar()),
        true
      );
    } else {
      scoreWin.style.height = "";
      followedLine = -99;
      setSlideY(0, true);
      // grille d'une seule ligne (ou partition vide) : halo sur l'unique ligne
      updateScoreHalo(0, true);
    }
  }

  /* ---------- géométrie du curseur asservi aux notes ----------
     La gravure abcjs n'espace PAS les événements proportionnellement à leur
     durée : un curseur linéaire par ligne dérive de la note en cours. On
     relève donc l'abscisse réellement gravée de CHAQUE événement de la
     timeline (silences compris — le mapping noteEls est 1:1) et l'engine
     interpole en temps entre ces ancres (BassRhythmEngine.cursorXAt). Sans
     mapping fiable (grille de secours), repli linéaire par ligne. */
  function computeCursorAnchors(){
    cursorAnchors = null;
    lineEndXs = [];
    if (!lines.length || !noteEls.length || noteEls.length !== currentNotes.length) return;
    var baseRect = scoreSlide.getBoundingClientRect();
    var anchors = [];
    for (var i = 0; i < noteEls.length; i++){
      var m = /(?:^|\s)abcjs-l(\d+)(?:\s|$)/.exec(noteEls[i].getAttribute("class") || "");
      if (!m) return; // ligne non identifiable : repli linéaire par ligne
      var line = parseInt(m[1], 10);
      if (line >= lines.length) return;
      var r = noteEls[i].getBoundingClientRect();
      anchors.push({
        beat: currentNotes[i].startBeats,
        x: (r.left + r.right) / 2 - baseRect.left,
        line: line
      });
    }
    for (var j = 0; j < lines.length; j++) lineEndXs.push(lines[j].x1);
    cursorAnchors = anchors;
  }

  /* ---------- pastilles ---------- */
  function buildBeats(){
    beatsEl.innerHTML = "";
    beatEls = [];
    var n = beatsPerBar();
    for (var i = 1; i <= n; i++){
      var d = document.createElement("div");
      d.className = "beat";
      d.textContent = i;
      beatsEl.appendChild(d);
      beatEls.push(d);
    }
  }

  /* La grille affichée change de signature : pastilles, tempo (nombre gardé,
     borné au plafond), unité du tempo et bascule Subdiviser (mesure
     composée seulement) la suivent. */
  function refreshGridMeter(){
    buildBeats();
    setBpm(bpm);
    updateTempoUnit();
    subdivideBtn.hidden = !Meter.analyzeMeter(gridMeter).compound;
  }

  function pulseBeat(idx){
    var el = beatEls[idx];
    if (!el) return;
    el.classList.remove("on", "strong");
    void el.offsetWidth;
    el.classList.add("on");
    if (idx === 0) el.classList.add("strong");
  }

  /* ---------- tempo ----------
     Le tempo compte le temps de la grille affichée (la noire pointée en
     mesure composée), borné par le moteur : 40–200, 40–120 en composée.
     Changer de signature garde le nombre, ramené sous le plafond. */
  function setBpm(v){
    v = window.BassRhythmEngine.clampTempo(v, gridMeter);
    if (v === bpm) return;
    bpm = v;
    // En vol : le moteur se ré-ancre au prochain battement, sans saut ni dérive.
    if (playing && transport) transport.setBpm(bpm);
    tempoNum.value = bpm;
    tempoNum.classList.remove("blip");
    void tempoNum.offsetWidth;
    tempoNum.classList.add("blip");
  }

  /* Unité du tempo, devant « BPM », quand le temps n'est pas une noire :
     blanche en /2, croche dans les /8 simples, noire pointée en mesure
     composée. Glyphe SVG embarqué (tête, hampe, crochet, point). */
  const tempoUnit = document.getElementById("tempo-unit");
  function noteGlyphSvg(figure, dotted){
    const hollow = figure === "blanche";
    const head = "<ellipse cx=\"5\" cy=\"19.5\" rx=\"3.7\" ry=\"2.6\" transform=\"rotate(-20 5 19.5)\"" +
      (hollow ? " fill=\"none\" stroke-width=\"1.3\"" : " stroke=\"none\"") + "/>";
    const stem = "<path d=\"M8.4 18.6V3\" fill=\"none\" stroke-width=\"1.2\"/>";
    const flag = figure === "croche" ? "<path d=\"M8.4 3c3 1.4 5.3 3.4 4.2 8.2\" fill=\"none\" stroke-width=\"1.2\"/>" : "";
    const dot = dotted ? "<circle cx=\"13.3\" cy=\"19.5\" r=\"1.4\" stroke=\"none\"/>" : "";
    return "<svg viewBox=\"0 0 16 24\" aria-hidden=\"true\">" + head + stem + flag + dot + "</svg>";
  }
  function updateTempoUnit(){
    const info = Meter.analyzeMeter(gridMeter);
    const plainQuarter = info.beatFigure === "noire" && !info.beatDotted;
    tempoUnit.hidden = plainQuarter;
    if (plainQuarter) return;
    tempoUnit.innerHTML = noteGlyphSvg(info.beatFigure, info.beatDotted);
    // nom de la figure (Composer), en minuscules au milieu de la phrase
    const names = info.beatDotted ? DOTTED_NAMES : FIG_NAMES;
    const figure = t(names[info.beatFigure]).toLocaleLowerCase(i18n.language);
    const label = t("tempo.unit", { figure: figure });
    tempoUnit.setAttribute("aria-label", label);
    tempoUnit.title = label;
  }

  /* ---------- banque de sons ----------
     4 sons pour la rythmique jouée et la préécoute. Un son échantillonné
     liste ses samples { url, midi, loopStart?, loopEnd? } (provenance et
     licences CC0 : docs/audio-sample-source.md) ; midi = hauteur SONNANTE
     mesurée du fichier (autocorrélation + spectre — fractionnaire si la
     prise n'est pas juste, ex. arco-Eb1 à −23 cents) : c'est elle qui
     garantit que chaque note de chaque son tombe sur sa hauteur cible
     (E sur le E1 d'une basse, 41,2 Hz — vérifié ±7 cents, 7 notes × 4 sons).
     La voix prend le sample le plus proche de la note d'entraînement et le
     transpose (playbackRate = 2^(Δ demi-tons/12)). loopStart/loopEnd
     (secondes de buffer, mesurés hors ligne) font TENIR la note indéfiniment
     (archet) ; growl (6 s source, C#1 : transposé vers l'aigu, ~5 s en E1
     jusqu'à ~2,8 s en D2) et Ergo (3,5–6 s, décroissance naturelle)
     couvrent les valeurs courantes, la ronde aux tempos lents s'éteint en
     fondu assumé.
     « Synthé » est l'oscillateur du moteur : aucune ressource.
     La note d'entraînement (NOTES) porte la hauteur sonnante (midi, une
     octave sous l'écrit, convention basse) et le jeton ABC écrit.

     Version dossier : fichiers téléchargés dès l'ouverture, décodés à la
     création de l'AudioContext (premier geste). Version fichier unique :
     scripts/build-single-file.mjs injecte chaque fichier en base64 dans
     window.BRT_EMBEDDED_SAMPLES (clé = nom de fichier), consommé AVANT tout
     fetch — indispensable en file://. Sample indisponible -> repli synthé à
     la hauteur choisie. */
  var NOTES = [
    { letter: "E", abc: "E,,", midi: 28 },
    { letter: "F", abc: "F,,", midi: 29 },
    { letter: "G", abc: "G,,", midi: 31 },
    { letter: "A", abc: "A,,", midi: 33 },
    { letter: "B", abc: "B,,", midi: 35 },
    { letter: "C", abc: "C,",  midi: 36 },
    { letter: "D", abc: "D,",  midi: 38 }
  ];
  var SOUNDS = [
    { id: "growl", samples: [
      { url: "assets/audio/growl-Db1.m4a", midi: 25 }
    ] },
    { id: "ergo", samples: [
      { url: "assets/audio/ergo-C1.wav",  midi: 24 },
      { url: "assets/audio/ergo-Eb1.wav", midi: 27 },
      { url: "assets/audio/ergo-Gb1.wav", midi: 30.06 },
      { url: "assets/audio/ergo-A1.wav",  midi: 33.08 },
      { url: "assets/audio/ergo-C2.wav",  midi: 36 }
    ] },
    { id: "arco", samples: [
      { url: "assets/audio/arco-Eb1.wav", midi: 26.77, loopStart: 1.393991, loopEnd: 6.561859 },
      { url: "assets/audio/arco-Gb1.wav", midi: 30, loopStart: 0.974195, loopEnd: 4.651610 },
      { url: "assets/audio/arco-A1.wav",  midi: 33, loopStart: 0.833696, loopEnd: 3.633152 },
      { url: "assets/audio/arco-C2.wav",  midi: 36, loopStart: 1.087166, loopEnd: 4.071746 },
      { url: "assets/audio/arco-Eb2.wav", midi: 39, loopStart: 1.578163, loopEnd: 4.296122 }
    ] },
    { id: "synth" } // oscillateur du moteur — dernier : repli de soundById
  ];
  var noteChoice = "D";
  var soundChoice = "growl";
  // voix de l'aide de pulsation (clic|groove) — préférence locale, hors lien de partage
  let pulsationVoice = playbackPrefs.pulsationVoice;

  var sampleStore = {}; // url -> { data: Promise<ArrayBuffer>, buffer, decoding, failed }

  function base64ToArrayBuffer(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function fetchSampleData(url){
    var em = window.BRT_EMBEDDED_SAMPLES;
    var name = url.split("/").pop();
    if (em && typeof em[name] === "string"){
      try { return Promise.resolve(base64ToArrayBuffer(em[name])); }
      catch (err) { /* base64 corrompu : on retombe sur le fetch */ }
    }
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    });
  }

  SOUNDS.forEach(function(sound){
    (sound.samples || []).forEach(function(s){
      var st = { data: fetchSampleData(s.url), buffer: null, decoding: null, failed: false };
      st.data.catch(function(){ st.failed = true; });
      sampleStore[s.url] = st;
    });
  });

  function decodeSample(url){
    var st = sampleStore[url];
    if (!st || !audioCtx) return Promise.reject(new Error(t("error.sampleUnavailable")));
    if (st.buffer) return Promise.resolve(st.buffer);
    if (!st.decoding){
      st.decoding = st.data.then(function(data){
        return new Promise(function(resolve, reject){
          // copie : decodeAudioData détache l'ArrayBuffer (une seule chance sinon)
          audioCtx.decodeAudioData(data.slice(0), resolve, reject);
        });
      }).then(function(buf){
        st.buffer = buf;
        return buf;
      }).catch(function(err){
        st.failed = true;
        throw err;
      });
      st.decoding.catch(function(){}); // rejet toujours observé
    }
    return st.decoding;
  }

  function decodeAllSamples(){
    if (!audioCtx) return;
    Object.keys(sampleStore).forEach(function(url){
      decodeSample(url).catch(function(){});
    });
  }

  function soundById(id){
    for (var i = 0; i < SOUNDS.length; i++) if (SOUNDS[i].id === id) return SOUNDS[i];
    return SOUNDS[SOUNDS.length - 1];
  }
  function noteByLetter(l){
    for (var i = 0; i < NOTES.length; i++) if (NOTES[i].letter === l) return NOTES[i];
    return NOTES[NOTES.length - 1];
  }
  function noteHz(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }
  function bestSample(sound, targetMidi){
    var best = null;
    var list = sound.samples || [];
    for (var i = 0; i < list.length; i++){
      if (!best || Math.abs(list[i].midi - targetMidi) < Math.abs(best.midi - targetMidi)) best = list[i];
    }
    return best;
  }

  /* Voix courante (son × note) — lue par le moteur à CHAQUE attaque et par la
     préécoute : changer de son ou de note s'applique en vol. Sample pas prêt
     ou en échec -> synthé à la hauteur choisie. */
  function voiceFor(soundId){
    var target = noteByLetter(noteChoice).midi;
    var s = bestSample(soundById(soundId), target);
    var st = s && sampleStore[s.url];
    if (st && st.buffer){
      return {
        buffer: st.buffer,
        rate: Math.pow(2, (target - s.midi) / 12),
        loopStart: s.loopStart || 0,
        loopEnd: s.loopEnd || 0
      };
    }
    return { synthHz: noteHz(target) };
  }
  function currentVoice(){ return voiceFor(soundChoice); }

  /* ---------- moteur de lecture (Web Audio, js/engine.js) ---------- */
  function ensureAudioContext(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      decodeAllSamples(); // les samples attendaient le contexte pour être décodés
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function settleTransportUi(){
    clearLit();
    cursor.classList.remove("live");
    countVeil.classList.remove("show");
    playBtn.classList.add("idle");
    playBtn.setAttribute("aria-label", t("transport.play"));
    iconPlay.style.display = "";
    iconPause.style.display = "none";
  }

  function haltTransport(){
    playing = false;
    liveNoteEvents = null;
    if (rafId) cancelAnimationFrame(rafId);
    if (transport){ transport.stop(); transport = null; }
  }

  function startPlayback(fromGridBeat){
    if (playing) return;
    if (!window.BassRhythmEngine) return;
    var ctx = ensureAudioContext();
    if (!ctx) return;
    computeLines();
    activeBpb = beatsPerBar();
    lastHeardBeat = fromGridBeat || 0;
    lastCycle = 0;
    // La fenêtre se cale sur le point de départ pendant le décompte : la
    // première mesure jouée est déjà sous les yeux, pas découverte à l'attaque.
    followScoreLine(lineOfGridBeat(fromGridBeat || 0, activeBpb), false);
    // Une attaque par note (chaîne liée = une seule, durée cumulée),
    // programmée par la même pompe lookahead que les clics. Le tableau est
    // gardé par référence : le flux ∞ y pousse la suite en cours de lecture.
    liveNoteEvents = window.BassRhythmEngine.noteSoundEvents(infiniteOn ? streamNotes : currentNotes);
    transport = window.BassRhythmEngine.createTransport({
      ctx: ctx,
      bpm: bpm,
      beatsPerBar: activeBpb,
      totalBeats: TOTAL_BEATS,
      startGridBeat: fromGridBeat || 0,
      subdivisions: window.BassRhythmEngine.beatSubdivisions(gridMeter, subdivideOn),
      noteEvents: liveNoteEvents,
      notesEnabled: soundOn,
      clicksEnabled: clickOn,
      pulsationVoice: pulsationVoice,
      pulsationVolumes: playbackPrefs.pulsationVolumes,
      noteVolume: playbackPrefs.noteVolume,
      getNoteVoice: currentVoice,
      loop: repeatOn && !infiniteOn
    });
    playing = true;
    playBtn.classList.remove("idle");
    playBtn.setAttribute("aria-label", t("transport.pause"));
    iconPlay.style.display = "none";
    iconPause.style.display = "";
    rafId = requestAnimationFrame(tick);
  }

  /* Pause : coupe net les clics programmés et mémorise le point de reprise
     rendu par le moteur — calé au DÉBUT de la mesure en cours (position
     entendue, latence déduite) : le re-décompte d'une mesure est ainsi suivi
     pile d'un temps 1, le métronome reste en phase avec les barres. Un seul
     chemin de lancement (startPlayback), simple et robuste. */
  function pausePlayback(){
    if (!playing || !transport) return;
    var info = transport.stop();
    transport = null;
    playing = false;
    liveNoteEvents = null;
    if (rafId) cancelAnimationFrame(rafId);
    pausedGridBeat = info ? info.resumeBeat : 0;
    settleTransportUi();
  }

  function stopAndReset(){
    haltTransport();
    clearShift();
    pausedGridBeat = 0;
    lastHeardBeat = 0;
    lastCycle = 0;
    settleTransportUi();
    followScoreLine(0, false); // la fenêtre revient doucement au début
  }

  function tick(){
    if (!playing || !transport) return;

    // Référentiel visuel UNIQUE : un événement programmé à T s'ENTEND à
    // T + latence de sortie (jusqu'à 100 ms et plus en Bluetooth). Tous les
    // visuels — pastilles, décompte, allumage, curseur, fin — se
    // lisent à transport.visualNow() = currentTime − latence : ce qui
    // s'affiche suit ce qui s'entend, jamais les instants programmés en
    // avance par le lookahead.
    var vNow = transport.visualNow();
    var due = transport.takeDueVisuals(vNow);
    for (var i = 0; i < due.length; i++){
      var ev = due[i];
      if (ev.type === "countin"){
        countNum.textContent = ev.countNumber;
        countNum.style.animationDuration = Math.min(60 / bpm, 1.4) + "s";
        countNum.classList.remove("tick");
        void countNum.offsetWidth;
        countNum.classList.add("tick");
        pulseBeat(ev.pulseIndex);
      } else {
        pulseBeat(ev.pulseIndex); // pastilles actives dans tous les modes
      }
    }

    if (transport.isFinished(vNow)){ stopAndReset(); return; }

    var pos = transport.positionAt(vNow);
    if (pos.countIn){
      countVeil.classList.add("show");
      cursor.classList.remove("live");
    } else {
      countVeil.classList.remove("show");

      // Position entendue, repliée dans la grille quand le repeat boucle ;
      // au rebouclage, la fenêtre se recale net sur le début (pas de glissée
      // à rebours à travers toute la partition).
      var gPos = Math.max(0, pos.gridBeat);
      if (isFinite(TOTAL_BEATS) && gPos >= TOTAL_BEATS){
        var cyc = Math.floor(gPos / TOTAL_BEATS);
        gPos -= cyc * TOTAL_BEATS;
        if (cyc !== lastCycle){
          lastCycle = cyc;
          followedLine = -99;
          followScoreLine(lineOfGridBeat(gPos, activeBpb), true);
        }
      }
      lastHeardBeat = gPos;

      // Fenêtre téléprompteur : suit la mesure ENTENDUE, même guide visuel
      // coupé — c'est le cadrage de la partition, pas une aide de lecture.
      followScoreLine(lineOfGridBeat(gPos, activeBpb), false);
      if (infiniteOn) streamTick(gPos);

      if (visualOn){
        // Guide visuel : allumage des notes et curseur, tous deux à la position
        // ENTENDUE (vNow). Le curseur est asservi aux notes : interpolation
        // en temps entre les abscisses réellement gravées, saut net au
        // changement de ligne — jamais en avance ni en retard sur la note
        // allumée. Repli linéaire par ligne si la géométrie manque.
        if (noteEls.length) updateLit(gPos);
        if (lines.length){
          var g = gPos;
          var L = null, x = 0;
          var cs = cursorAnchors
            ? window.BassRhythmEngine.cursorXAt(cursorAnchors, lineEndXs, TOTAL_BEATS, g)
            : null;
          if (cs && lines[cs.line]){
            L = lines[cs.line];
            x = cs.x;
          } else {
            var span = isFinite(TOTAL_BEATS) ? TOTAL_BEATS : (streamBeats || 1);
            var lf = (g / span) * lines.length;
            var li = Math.min(lines.length - 1, Math.floor(lf));
            L = lines[li];
            x = L.x0 + (L.x1 - L.x0) * (lf - li);
          }
          cursor.style.height = (L.y1 - L.y0) + "px";
          cursor.style.transform = "translate(" + x + "px," + L.y0 + "px)";
          cursor.classList.add("live");
        } else {
          cursor.classList.remove("live");
        }
      } else {
        // Guide visuel coupé : extinction et curseur masqué.
        clearLit();
        cursor.classList.remove("live");
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  /* ---------- flux ∞ : extension + recalage de la fenêtre de rendu ----------
     Extension : la tranche rendue est toujours pleine plus un chunk d'avance
     (les attaques sont poussées dans le tableau vivant du transport).
     Recalage : une fois la glissée posée (cran >= 2), la tranche avance pour
     ramener la ligne jouée à l'index 1 — mêmes pixels après re-rendu (chaque
     système est gravé indépendamment et la signature ne bouge pas, M:none),
     hors du moment critique de l'entrée de ligne. Piloté par la rAF (les
     setTimeout sont throttlés sur mobile), avec filet de sécurité : si la
     ligne sous la ligne jouée n'était pas rendue, recalage immédiat. */
  function doStreamShift(){
    shiftAt = 0;
    if (!infiniteOn || followedLine < 1) return;
    winStartBar += followedLine * perLine;
    renderScore(false);
    computeLines();
  }
  function streamTick(g){
    ensureStreamDepth();
    if (followedLine >= 2 && !shiftAt) shiftAt = performance.now() + 600;
    if (shiftAt && performance.now() >= shiftAt) doStreamShift();
    if (lineOfGridBeat(g, activeBpb) + 1 >= lines.length) doStreamShift();
  }

  function togglePlay(){
    if (playing) pausePlayback();
    else startPlayback(pausedGridBeat);
  }

  /* ---------- aides de lecture (bascules indépendantes) ----------
     Effet immédiat, y compris en cours de lecture : la rAF lit visualOn à
     chaque image ; métronome et son basculent dans le moteur sans toucher la
     lecture (coupure nette du programmé non joué, reprise dans l'horizon).
     Chaque bascule part de la préférence mémorisée prefs[key] et la met à
     jour elle-même. bindToggle rend un setter, pour qu'un curseur de volume
     puisse couper ou rallumer son aide ; tout changement émet
     « aids-change » (pastille du déclencheur). */
  function bindToggle(id, prefs, key, fn){
    var btn = document.getElementById(id);
    btn.classList.toggle("active", prefs[key]);
    btn.setAttribute("aria-pressed", String(prefs[key]));
    function set(on){
      if (on === btn.classList.contains("active")) return;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", String(on));
      prefs[key] = on;
      savePlaybackPrefs();
      fn(on);
      document.dispatchEvent(new Event("aids-change"));
    }
    btn.addEventListener("click", function(){
      set(!btn.classList.contains("active"));
    });
    return set;
  }
  const setClickAid = bindToggle("tgl-click", playbackPrefs.aids, "click", function(on){
    clickOn = on;
    if (playing && transport) transport.setClicksEnabled(on);
    // rallumé après un curseur descendu à zéro : retour au niveau par défaut
    if (on && playbackPrefs.pulsationVolumes[pulsationVoice] === 0) setPulseVolume(1);
    refreshPulseVolume();
  });
  bindToggle("tgl-visual", playbackPrefs.aids, "visual", function(on){
    visualOn = on;
    if (!on){
      clearLit();
      cursor.classList.remove("live");
    }
  });
  const setSoundAid = bindToggle("tgl-sound", playbackPrefs.aids, "sound", function(on){
    soundOn = on;
    if (playing && transport) transport.setNotesEnabled(on);
    if (on && playbackPrefs.noteVolume === 0) setNoteVolume(1);
    refreshNoteVolume();
  });
  /* Subdiviser : n'apparaît qu'en mesure composée (refreshGridMeter) ;
     s'applique en vol aux temps suivants. */
  const subdivideBtn = document.getElementById("tgl-subdivide");
  bindToggle("tgl-subdivide", playbackPrefs, "subdivide", function(on){
    subdivideOn = on;
    if (playing && transport){
      transport.setSubdivisions(window.BassRhythmEngine.beatSubdivisions(gridMeter, on));
    }
  });

  /* Volumes du panneau des aides : pulsation (voix active, clic ou
     groove) et note, du silence à VOLUME_MAX fois le niveau par défaut, en
     vol. Valeur du curseur de 0 à 300 par pas de 5, volume = valeur / 100 :
     le niveau par défaut tombe pile sur 100. Aucun chiffre affiché.
     Chaque curseur est lié à l'icône de son aide, comme un volume de
     lecteur vidéo : aide coupée = curseur à zéro (le volume réglé reste
     mémorisé) ; monter le curseur rallume l'aide ; le descendre à zéro la
     coupe, et la rallumer ensuite repart du niveau par défaut. Chaque voix de
     pulsation garde sa valeur. La préférence est écrite au relâchement
     (change), pas à chaque pas. */
  const pulseVolumeInput = document.getElementById("pulse-volume");
  const pulseVolumeVoice = document.getElementById("pulse-volume-voice");
  const noteVolumeInput = document.getElementById("note-volume");

  function showVolume(input, volume){
    input.value = String(Math.round(volume * 100));
    input.style.setProperty("--fill", volume * 100 / 3 + "%");
  }
  function setPulseVolume(volume){
    playbackPrefs.pulsationVolumes[pulsationVoice] = volume;
    if (playing && transport) transport.setPulsationVolume(pulsationVoice, volume);
  }
  function setNoteVolume(volume){
    playbackPrefs.noteVolume = volume;
    if (playing && transport) transport.setNoteVolume(volume);
  }
  function refreshPulseVolume(){
    const isGroove = pulsationVoice === "groove";
    showVolume(pulseVolumeInput, clickOn ? playbackPrefs.pulsationVolumes[pulsationVoice] : 0);
    pulseVolumeInput.setAttribute("aria-label", t(isGroove ? "volume.groove" : "volume.click"));
    pulseVolumeVoice.textContent = t(isGroove ? "beat.groove" : "beat.click");
  }
  function refreshNoteVolume(){
    showVolume(noteVolumeInput, soundOn ? playbackPrefs.noteVolume : 0);
  }
  pulseVolumeInput.addEventListener("input", function(){
    const volume = Number(pulseVolumeInput.value) / 100;
    setPulseVolume(volume);
    setClickAid(volume > 0);
    refreshPulseVolume();
  });
  noteVolumeInput.addEventListener("input", function(){
    const volume = Number(noteVolumeInput.value) / 100;
    setNoteVolume(volume);
    setSoundAid(volume > 0);
    refreshNoteVolume();
  });
  pulseVolumeInput.addEventListener("change", savePlaybackPrefs);
  noteVolumeInput.addEventListener("change", savePlaybackPrefs);
  refreshPulseVolume();
  refreshNoteVolume();

  /* Déclencheur des aides : un seul cercle qui déplie le flotteur des trois
     bascules. La rangée reste symétrique (play centré) ; le flotteur se referme
     au clic ailleurs ou sur Échap, mais reste ouvert quand on enchaîne les
     bascules. Une pastille signale qu'au moins une aide est active, replié. */
  (function(){
    var aids = document.getElementById("aids");
    var aidsToggle = document.getElementById("aids-toggle");
    var aidsPanel = document.getElementById("aids-panel");
    if (!aids || !aidsToggle || !aidsPanel) return;
    var aidIds = ["tgl-click","tgl-visual","tgl-sound"];

    function closeAids(){
      aids.classList.remove("open");
      aidsToggle.setAttribute("aria-expanded", "false");
    }
    aidsToggle.addEventListener("click", function(e){
      e.stopPropagation();
      var open = !aids.classList.contains("open");
      aids.classList.toggle("open", open);
      aidsToggle.setAttribute("aria-expanded", String(open));
    });
    // clic dans le flotteur : on garde ouvert pour enchaîner les bascules
    aidsPanel.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("click", function(){
      if (aids.classList.contains("open")) closeAids();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeAids();
    });

    // pastille : reflète l'état des bascules après chaque changement
    function refreshAidsBadge(){
      var any = aidIds.some(function(id){
        var b = document.getElementById(id);
        return b && b.classList.contains("active");
      });
      aids.classList.toggle("has-active", any);
    }
    document.addEventListener("aids-change", refreshAidsBadge);
    refreshAidsBadge();
  })();

  /* ---------- tiroir ---------- */
  /* Le bandeau de retour n'apparaît que lorsqu'une grille composée est chargée
     dans le lecteur : il offre un raccourci explicite vers une grille générée. */
  function updateComposedBanner(){
    var banner = document.getElementById("composed-banner");
    if (banner) banner.hidden = !composedGrid;
  }
  /* Rend le focus au déclencheur avant de masquer un tiroir : aria-hidden ne
     doit jamais recouvrir l'élément focalisé (le focus serait « caché » aux
     lecteurs d'écran — avertissement navigateur et piège au clavier). No-op si
     le focus n'est pas dans le panneau (fermeture à la souris). preventScroll
     évite un saut de page quand le focus revient sur le bouton d'en-tête. */
  function returnFocus(panel, trigger){
    if (panel.contains(document.activeElement)) trigger.focus({ preventScroll: true });
  }
  function openDrawer(){
    closeComposer(); // Jouer et Composer ne s'ouvrent jamais ensemble
    updateComposedBanner();
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    settingsBtn.setAttribute("aria-expanded", "true");
    veil.classList.add("show");
  }
  function closeDrawer(){
    returnFocus(drawer, settingsBtn); // avant aria-hidden
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    settingsBtn.setAttribute("aria-expanded", "false");
    veil.classList.remove("show");
  }
  settingsBtn.addEventListener("click", openDrawer);
  document.getElementById("close-btn").addEventListener("click", closeDrawer);
  veil.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ closeDrawer(); closeComposer(); }
  });

  function bindPills(containerId, onChange){
    var box = document.getElementById(containerId);
    box.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("change", function(){
        box.querySelectorAll(".pill").forEach(function(p){
          p.classList.toggle("checked", p.querySelector("input").checked);
        });
        if (onChange) onChange(inp.value);
      });
    });
  }
  /* ---------- signature : composant partagé (tiroir Jouer et Composer) ----------
     Quatre pastilles courantes (2/4, 3/4, 4/4, 6/8) et « Autre… », qui
     déplie la signature gravée sur un bout de portée (abcjs, comme la
     partition) : le numérateur (1 à 12) sur le dénominateur (2, 4 ou 8),
     chacun réglé par − / +, ou ↑ ↓ au clavier (motif ARIA spinbutton : les
     boutons sont hors de l'arbre d'accessibilité, la légende de la ligne
     porte le focus). Une
     signature hors des pastilles ouvre « Autre… » d'elle-même. onChange
     reçoit la nouvelle signature et peut la refuser en rendant false : le
     composant revient alors à la précédente. setValue l'aligne sur un état
     restauré (lien, grille composée), sans appeler onChange. */
  const COMMON_METERS = ["2/4", "3/4", "4/4", "6/8"];
  /* Figure qui sert d'unité, selon le dénominateur. */
  const METER_UNIT_KEYS = { 2: "figureDefinite.half", 4: "figureDefinite.quarter", 8: "figureDefinite.eighth" };
  /* Signature gravée par abcjs sur un bout de portée, rognée autour des
     chiffres. La portée est gravée avec sa clé, puis la clé est retirée :
     sa place laisse de la portée avant les chiffres. Rendue hors écran (getBBox exige un élément affiché, le
     panneau peut être replié), puis mise en cache par signature. */
  const meterStaffCache = {};
  function meterStaffSvg(meter){
    if (meterStaffCache.hasOwnProperty(meter)) return meterStaffCache[meter];
    let svg = "";
    if (window.ABCJS){
      const tmp = document.createElement("div");
      tmp.style.cssText = "position:absolute;left:-9999px;top:0";
      document.body.appendChild(tmp);
      try {
        window.ABCJS.renderAbc(tmp, "X:1\nM:" + meter + "\nL:1/8\nK:C clef=bass\nx\n", { add_classes: true });
        const s = tmp.querySelector("svg");
        const sig = s && s.querySelector(".abcjs-time-signature");
        const staff = s && s.querySelector(".abcjs-staff");
        if (sig && staff){
          s.querySelectorAll(".abcjs-clef, .abcjs-bar, style, title").forEach(function(e){ e.remove(); });
          const sb = sig.getBBox();
          const tb = staff.getBBox();
          // Autant de portée de part et d'autre : les chiffres au milieu.
          const pad = Math.min(16, sb.x - tb.x);
          const left = sb.x - pad;
          const w = sb.width + pad * 2;
          s.setAttribute("viewBox", left + " " + tb.y + " " + w + " " + tb.height);
          s.setAttribute("height", "50");
          s.setAttribute("width", String(Math.round(50 * w / tb.height)));
          svg = s.outerHTML;
        }
      } finally {
        tmp.remove();
      }
    }
    meterStaffCache[meter] = svg;
    return svg;
  }
  function createMeterPicker(host, initial, onChange){
    let value = initial;
    let customOpen = COMMON_METERS.indexOf(initial) === -1;
    // Valeurs permises de chaque chiffre, dans l'ordre de la fraction.
    const partValues = [
      Array.from({ length: Meter.METER_NUMERATOR_MAX }, function(_, i){ return i + 1; }),
      Meter.METER_DENOMINATORS
    ];
    const partRowHtml = function(part, label){
      return "<div class=\"meter-row\">" +
        "<button type=\"button\" class=\"meter-step\" data-meter-step=\"" + part + "\" data-dir=\"-1\" tabindex=\"-1\" aria-hidden=\"true\">−</button>" +
        "<button type=\"button\" class=\"meter-step\" data-meter-step=\"" + part + "\" data-dir=\"1\" tabindex=\"-1\" aria-hidden=\"true\">+</button>" +
        "<span class=\"meter-hint\" data-meter-part=\"" + part + "\" role=\"spinbutton\" tabindex=\"0\" aria-label=\"" + label + "\"></span>" +
        "</div>";
    };
    host.innerHTML =
      "<div class=\"pills\" role=\"group\" aria-label=\"" + t("field.timeSignature") + "\">" +
      COMMON_METERS.map(function(m){
        return "<button type=\"button\" class=\"pill\" data-meter=\"" + m + "\"><span class=\"frac\">" + m + "</span></button>";
      }).join("") +
      "<button type=\"button\" class=\"pill\" data-meter-other aria-expanded=\"false\">" + t("meter.other") + "</button>" +
      "</div>" +
      "<div class=\"meter-custom\" hidden>" +
      "<div class=\"meter-staff\" aria-hidden=\"true\"></div>" +
      "<div class=\"meter-rows\">" +
      partRowHtml(0, t("meter.numerator")) +
      partRowHtml(1, t("meter.denominator")) +
      "</div>" +
      "</div>";
    const other = host.querySelector("[data-meter-other]");
    const custom = host.querySelector(".meter-custom");
    const staff = host.querySelector(".meter-staff");

    function render(){
      host.querySelectorAll("[data-meter]").forEach(function(pill){
        const on = !customOpen && pill.dataset.meter === value;
        pill.classList.toggle("checked", on);
        pill.setAttribute("aria-pressed", String(on));
      });
      other.classList.toggle("checked", customOpen);
      other.setAttribute("aria-expanded", String(customOpen));
      custom.hidden = !customOpen;
      const parts = value.split("/");
      if (customOpen) staff.innerHTML = meterStaffSvg(value);
      host.querySelector("[data-meter-part='0']").textContent = t("meter.countHint");
      host.querySelector("[data-meter-part='1']").textContent = t("meter.unitHint", { figure: t(METER_UNIT_KEYS[parts[1]]) });
      partValues.forEach(function(values, part){
        const index = values.indexOf(Number(parts[part]));
        const digit = host.querySelector("[data-meter-part='" + part + "']");
        digit.setAttribute("aria-valuenow", parts[part]);
        digit.setAttribute("aria-valuemin", String(values[0]));
        digit.setAttribute("aria-valuemax", String(values[values.length - 1]));
        host.querySelector("[data-meter-step='" + part + "'][data-dir='-1']").disabled = index === 0;
        host.querySelector("[data-meter-step='" + part + "'][data-dir='1']").disabled = index === values.length - 1;
      });
    }
    function request(next, openCustom){
      const previous = value;
      const previousOpen = customOpen;
      customOpen = openCustom;
      value = next;
      render();
      if (next !== previous && onChange(next) === false){
        value = previous;
        customOpen = previousOpen;
        render();
      }
    }
    // Passe un chiffre à la valeur permise voisine ; rien au bout de la plage.
    function step(part, dir){
      const parts = value.split("/");
      const values = partValues[part];
      const next = values[values.indexOf(Number(parts[part])) + dir];
      if (next === undefined) return;
      parts[part] = next;
      request(parts.join("/"), true);
    }
    host.addEventListener("click", function(e){
      const stepper = e.target.closest("[data-meter-step]");
      if (stepper){
        step(Number(stepper.dataset.meterStep), Number(stepper.dataset.dir));
        return;
      }
      const pill = e.target.closest("[data-meter]");
      if (pill){
        request(pill.dataset.meter, false);
        return;
      }
      if (e.target.closest("[data-meter-other]")){
        // « Autre… » se replie sur une signature courante, reste ouvert sinon.
        request(value, !customOpen || COMMON_METERS.indexOf(value) === -1);
      }
    });
    // Les boutons − / + sont hors de l'arbre d'accessibilité : un clic ne doit
    // pas leur donner le focus (le navigateur refuserait alors aria-hidden).
    host.addEventListener("mousedown", function(e){
      if (e.target.closest("[data-meter-step]")) e.preventDefault();
    });
    host.addEventListener("keydown", function(e){
      const digit = e.target.closest("[data-meter-part]");
      const dir = { ArrowUp: 1, ArrowDown: -1 }[e.key];
      if (!digit || !dir) return;
      e.preventDefault();
      step(Number(digit.dataset.meterPart), dir);
    });
    render();
    return {
      value: function(){ return value; },
      setValue: function(meter){
        // Un simple rafraîchissement (même signature) laisse « Autre… » tel
        // quel : les flèches peuvent passer par 3/4 sans le replier.
        if (meter !== value) customOpen = COMMON_METERS.indexOf(meter) === -1;
        value = meter;
        render();
      }
    };
  }

  /* Tiroir Jouer : la signature ne vaut qu'au prochain tirage (Générer) ; la
     grille affichée garde la sienne jusque-là. */
  const sigPicker = createMeterPicker(document.getElementById("sig-picker"), signature, function(v){
    signature = v;
    updateTechniqueAvailability();
  });

  /* ---------- procédés : pastilles à cocher ----------
     Un procédé inapplicable avec les figures cochées et la signature est
     grisé et décoché, avec une aide courte : ce qui lui manque (« nécessite
     la croche »), ou, pour les triolets, la signature qui les exclut (« pas
     en mesure composée »). Le générateur dit ce qui manque (techniqueNeeds,
     tripletFigure) ; la page n'en fait que le texte. */
  /* Figure avec son article (« la croche ») : clé figureDefinite.*, dérivée
     de celle du nom de la figure (FIG_NAMES). */
  function figureDefinite(fig){
    return t(FIG_NAMES[fig].replace("figure.", "figureDefinite."));
  }

  /* Valeurs des cases cochées d'un groupe (figures, procédés). */
  function checkedValues(name){
    return Array.from(document.querySelectorAll("input[name='" + name + "']:checked"), function(inp){
      return inp.value;
    });
  }

  /* Les autres procédés cochés comptent : en 5/8, la noire pointée de
     Points peut seule ouvrir la place d'un soupir. */
  function techniqueHelp(technique, figures){
    if (!figures.length) return "";
    const G = window.BassRhythmGenerator;
    const others = checkedValues("technique").filter(function(p){ return p !== technique; });
    const needs = G.techniqueNeeds({ figures: figures, meter: signature, techniques: others }, technique);
    if (!needs) return "";
    if (technique === "triplets" && !G.tripletFigure(signature)){
      return t(Meter.analyzeMeter(signature).compound ? "technique.notCompound" : "technique.notEighth");
    }
    if (!needs.length) return t("technique.needsMore");
    return t("technique.needs", {
      figures: listFormat.format(needs.map(figureDefinite))
    });
  }

  function updateTechniqueAvailability(){
    const figures = checkedValues("fig");
    document.querySelectorAll("#technique-pills .pill").forEach(function(pill){
      const input = pill.querySelector("input");
      const help = techniqueHelp(input.value, figures);
      input.disabled = help !== "";
      if (input.disabled) input.checked = false;
      pill.classList.toggle("disabled", input.disabled);
      pill.classList.toggle("checked", input.checked);
      pill.querySelector(".pill-hint").textContent = help;
      if (help) pill.title = help;
      else pill.removeAttribute("title");
    });
  }
  document.querySelectorAll("input[name='fig']").forEach(function(inp){
    inp.addEventListener("change", updateTechniqueAvailability);
  });
  document.querySelectorAll("input[name='technique']").forEach(function(inp){
    inp.addEventListener("change", updateTechniqueAvailability);
  });
  bindPills("mes-pills", function(v){
    measuresChoice = v;
  });

  /* ---------- son et note d'entraînement ----------
     Le son s'applique en vol (le moteur lit currentVoice à chaque attaque).
     La note re-hausse la grille AFFICHÉE sans en changer le rythme : seuls
     les jetons de note du corps ABC changent (l'en-tête K: est préservé),
     la timeline currentNotes est indépendante de la hauteur. */
  function rePitchAbc(abc, tok){
    var mark = "clef=bass\n";
    var i = abc.indexOf(mark);
    if (i === -1) return abc;
    return abc.slice(0, i + mark.length) +
      abc.slice(i + mark.length).replace(/[A-G],{0,2}/g, tok);
  }
  document.querySelectorAll('#sound-list input[name="sound"]').forEach(function(inp){
    inp.addEventListener("change", function(){
      if (!inp.checked) return;
      soundChoice = inp.value;
    });
  });
  /* Voix de pulsation : préférence mémorisée, appliquée en vol (les temps
     suivants jouent la nouvelle voix, à son volume). */
  document.querySelectorAll('#pulsation-list input[name="pulsation"]').forEach(function(inp){
    inp.checked = inp.value === pulsationVoice;
    inp.addEventListener("change", function(){
      if (!inp.checked) return;
      pulsationVoice = inp.value;
      playbackPrefs.pulsationVoice = pulsationVoice;
      savePlaybackPrefs();
      if (playing && transport) transport.setPulsationVoice(pulsationVoice);
      refreshPulseVolume();
    });
  });
  bindPills("note-pills", function(v){
    noteChoice = v;
    currentAbc = rePitchAbc(currentAbc, noteByLetter(v).abc);
    renderScore(true);
    computeLines();
    updateShareUrl(); // la note fait partie du lien (graine comme contenu composé)
    // en lecture, les attaques suivantes prennent la nouvelle hauteur
  });

  /* Préécoute : ~1,5 s du son de la ligne, à la note choisie, sans toucher à
     la sélection (preventDefault court-circuite l'activation du label). Le
     premier clic crée l'AudioContext ; on attend le décodage du sample visé
     avant de jouer (repli synthé si échec). */
  var previewHandle = null;
  document.querySelectorAll("#sound-list .preview").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      var ctx = ensureAudioContext();
      if (!ctx) return;
      var id = btn.dataset.sound;
      var play = function(){
        if (previewHandle) previewHandle.stop();
        previewHandle = window.BassRhythmEngine.playNotePreview(ctx, voiceFor(id), 1.5);
      };
      var s = bestSample(soundById(id), noteByLetter(noteChoice).midi);
      if (s && !(sampleStore[s.url] && sampleStore[s.url].buffer)){
        decodeSample(s.url).then(play, play);
      } else {
        play();
      }
    });
  });

  /* Préécoute du groove : une mesure de 4/4 (~1,6 s), sans lancer l'exercice.
     Partage previewHandle avec la préécoute du son : l'une coupe l'autre. */
  document.querySelectorAll("#pulsation-list .preview").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      var ctx = ensureAudioContext();
      if (!ctx) return;
      if (previewHandle) previewHandle.stop();
      previewHandle = window.BassRhythmEngine.playGroovePreview(ctx, 1.6);
    });
  });

  /* ---------- génération de la grille ---------- */
  function readConfig(){
    const techniques = checkedValues("technique");
    var inf = measuresChoice === "inf";
    return {
      figures: checkedValues("fig"),
      techniques: techniques,
      meter: signature,
      // ∞ : le flux est généré par chunks de CHUNK_BARS avec ces réglages
      measures: inf ? CHUNK_BARS : parseInt(measuresChoice, 10),
      note: noteByLetter(noteChoice).abc,
      infinite: inf
    };
  }

  function clearShift(){
    shiftAt = 0;
  }

  /* Le flux garde toujours de quoi remplir la tranche rendue plus un chunk
     d'avance — appelé avant chaque rendu et à chaque image de lecture : la
     portée ne peut jamais « arriver » à l'écran. */
  function ensureStreamDepth(){
    var needBars = winStartBar + RENDER_LINES * perLine + CHUNK_BARS;
    while (streamBars.length < needBars) extendStream();
  }

  /* Étend le flux ∞ d'un chunk : mesures et timeline (temps globaux), et —
     lecture en cours — pousse les attaques correspondantes dans le tableau
     d'événements que la pompe du transport lit par référence. */
  function extendStream(){
    if (!window.BassRhythmGenerator || !streamCfg) return;
    var res = window.BassRhythmGenerator.generateExercise(streamCfg);
    var base = streamBeats;
    var added = [];
    for (var i = 0; i < res.bars.length; i++) streamBars.push(res.bars[i]);
    for (i = 0; i < res.notes.length; i++){
      var n = res.notes[i];
      var ev = {
        startBeats: base + n.startBeats,
        durationBeats: n.durationBeats,
        isRest: n.isRest,
        tiedToNext: n.tiedToNext
      };
      streamNotes.push(ev);
      added.push(ev);
    }
    streamBeats += res.bars.length * beatsPerBar();
    streamHeader = res.header;
    if (liveNoteEvents){
      var evs = window.BassRhythmEngine.noteSoundEvents(added);
      for (i = 0; i < evs.length; i++) liveNoteEvents.push(evs[i]);
    }
  }

  /* ---------- graine, URL partageable, copie ---------- */
  function randomSeed(){
    // Math.random ne sert qu'à TIRER la graine, jamais à fabriquer la grille
    // (celle-ci dérive de la graine via makeRng) : la grille reste reproductible.
    return Math.floor(Math.random() * 4294967296) >>> 0;
  }

  function shareState(){
    var cfg = readConfig();
    return {
      seed: currentSeed,
      figures: cfg.figures,
      techniques: cfg.techniques,
      meter: cfg.meter,
      note: noteChoice,       // lettre A–G ; la note ne change que la hauteur affichée, pas le rythme
      measures: measuresChoice // "4" | "8" | "16" | "inf"
    };
  }

  function shareHash(){
    // Grille composée : contenu complet (second format d'URL, cf. ADR 0001) ;
    // grille générée : graine + réglages.
    if (composedGrid){
      return "#" + window.BassRhythmGenerator.encodeComposed({
        meter: composedGrid.meter,
        note: noteChoice,
        events: composedGrid.events
      });
    }
    return "#" + window.BassRhythmGenerator.encodeShare(shareState());
  }

  function updateShareUrl(){
    if (!window.BassRhythmGenerator) return;
    var hash = shareHash();
    try {
      history.replaceState(null, "", hash); // même document : pas d'entrée d'historique, pas de saut de défilement
    } catch (e) {
      try { location.hash = hash.slice(1); } catch (e2) {} // repli si file:// refuse replaceState
    }
  }

  function showToast(msg){
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1700);
  }

  function flashCopied(){
    if (!copyLinkBtn) return;
    copyLinkBtn.classList.add("copied");
    clearTimeout(flashCopied._t);
    flashCopied._t = setTimeout(function(){ copyLinkBtn.classList.remove("copied"); }, 1200);
  }

  /* Copie robuste : l'API Clipboard exige un contexte sécurisé (https/localhost),
     indisponible sur le http de GitHub Pages -> repli execCommand sur textarea.
     Retourne une promesse résolue en cas de succès, rejetée sinon. */
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(function(){
        if (legacyCopy(text)) return;
        throw new Error(t("error.copyDenied"));
      });
    }
    return legacyCopy(text) ? Promise.resolve() : Promise.reject(new Error(t("error.copyDenied")));
  }
  function legacyCopy(text){
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e){
      return false;
    }
  }

  function generateGrid(animate, seed){
    if (!window.BassRhythmGenerator) return false;
    var cfg = readConfig();
    composedGrid = null; // Générer produit une grille générée : le partage repasse en format graine
    // Graine imposée (restauration depuis l'URL) : reproduction exacte, sans
    // anti-doublon. Sinon graine tirée au sort à chaque génération.
    var fixed = (typeof seed === "number");
    const previousMeter = gridMeter;
    // le flux et la durée de la grille comptent ses temps
    gridMeter = cfg.meter;
    try {
      clearShift();
      infiniteOn = !!cfg.infinite;
      if (infiniteOn){
        // Flux ∞ : UNE seule instance de rng, réutilisée à chaque tranche via
        // streamCfg (l'état avance) — flux déterministe ET varié depuis la graine.
        currentSeed = (fixed ? seed : randomSeed()) >>> 0;
        cfg.rng = window.BassRhythmGenerator.makeRng(currentSeed);
        streamCfg = cfg;
        streamBars = [];
        streamNotes = [];
        streamBeats = 0;
        winStartBar = 0;
        lastHeardBeat = 0;
        extendStream(); // le rendu remplit ensuite via ensureStreamDepth
        currentBars = null;
        currentHeader = "";
        TOTAL_BEATS = Infinity;
      } else {
        streamCfg = null;
        var res, s;
        if (fixed){
          s = seed >>> 0;
          cfg.rng = window.BassRhythmGenerator.makeRng(s);
          res = window.BassRhythmGenerator.generateExercise(cfg);
        } else {
          // Nouvelle graine à chaque essai : deux clics successifs donnent deux
          // grilles différentes, et la graine retenue rejoue exactement la
          // grille via un unique appel (clé de la reproductibilité).
          for (var i = 0; i < 8; i++){
            s = randomSeed();
            cfg.rng = window.BassRhythmGenerator.makeRng(s);
            res = window.BassRhythmGenerator.generateExercise(cfg);
            if (res.abc !== currentAbc) break;
          }
        }
        currentSeed = s >>> 0;
        currentAbc = res.abc;
        currentNotes = res.notes; // alimente l'allumage des notes (mode 2)
        currentBars = res.bars || null;     // re-découpage responsive (2 ou 4 mesures/système)
        currentHeader = res.header || "";
        TOTAL_BEATS = cfg.measures * beatsPerBar();
      }
      // Boucler un flux sans fin n'a pas de sens : l'emplacement du repeat
      // devient le témoin ∞ du mode (non cliquable).
      repeatBtn.classList.toggle("inf", infiniteOn);
      repeatBtn.disabled = infiniteOn;
      if (infiniteOn){
        repeatBtn.classList.remove("active");
        repeatBtn.removeAttribute("aria-pressed");
        repeatBtn.setAttribute("aria-label", t("transport.unlimited"));
        repeatBtn.title = t("transport.unlimited");
      } else {
        repeatBtn.classList.toggle("active", repeatOn);
        repeatBtn.setAttribute("aria-pressed", String(repeatOn));
        repeatBtn.setAttribute("aria-label", t("transport.loop"));
        repeatBtn.title = t("transport.loop");
      }
      updateExerciseTitle(cfg, animate); // l'en-tête suit chaque grille réellement affichée
      updateShareUrl(); // le hash de l'URL reflète la grille affichée (bookmarkable, prêt à copier)
      refreshGridMeter();
      return true;
    } catch (err) {
      // figures incapables de remplir la signature : la grille reste
      gridMeter = previousMeter;
      return false;
    }
  }

  /* ---------- actions ---------- */
  function regenerate(){
    stopAndReset();
    generateGrid(true);
    renderScore(true);
    computeLines();
    closeDrawer();
  }
  document.getElementById("generate-btn").addEventListener("click", regenerate);
  // « Revenir à une grille générée » : abandonne la grille composée et regénère
  // une grille classique (regenerate remet composedGrid à null et ferme le tiroir).
  document.getElementById("back-to-generated").addEventListener("click", regenerate);

  /* ---------- retour au début ----------
     En lecture : relance immédiate depuis le début de la grille, décompte
     d'une mesure inclus, par le chemin de lancement unique (startPlayback) —
     mode de guidage et tempo intacts, stop() du moteur coupe les nœuds
     actifs et annule les notes programmées (mêmes garanties que Rejouer).
     En pause : seul le point de reprise revient à 0 (play repartira de la
     mesure 1 avec décompte), la lecture reste suspendue. À l'arrêt (avant
     lecture ou après fin) : simple remise au repos des visuels et du statut,
     sans lancer la lecture. NB : une pause en mesure 1 mémorise déjà 0 —
     elle suit alors le même chemin que l'arrêt, sans rien perdre. */
  function rewindToStart(){
    clearShift();
    if (infiniteOn && winStartBar !== 0){
      // Flux ∞ : la fenêtre de rendu revient au début du flux déjà généré.
      winStartBar = 0;
      lastHeardBeat = 0;
      renderScore(false);
      computeLines();
    }
    if (playing){
      stopAndReset();
      startPlayback(0);
    } else if (pausedGridBeat > 0){
      pausedGridBeat = 0;
      followScoreLine(0, false);
    } else {
      stopAndReset();
    }
  }
  rewindBtn.addEventListener("click", rewindToStart);

  /* ---------- repeat : boucle sans couture (pas de nouveau décompte) ----------
     Armé, l'exercice reboucle sur lui-même à la barre finale ; coupé en vol,
     le cycle en cours se termine normalement. Sans objet en flux ∞ (masqué). */
  repeatBtn.addEventListener("click", function(){
    if (infiniteOn) return; // témoin ∞, pas une commande
    repeatOn = !repeatOn;
    repeatBtn.classList.toggle("active", repeatOn);
    repeatBtn.setAttribute("aria-pressed", String(repeatOn));
    if (playing && transport) transport.setLoop(repeatOn && !infiniteOn);
  });

  /* ---------- copier le lien de la grille ----------
     Le hash encode graine + réglages : le lien rejoue la grille exacte chez qui
     l'ouvre (l'appli hébergée le restaure au chargement). */
  copyLinkBtn.addEventListener("click", function(){
    updateShareUrl(); // garantit que location.href reflète la grille affichée
    copyText(location.href).then(function(){
      flashCopied();
      showToast(t("toast.linkCopied"));
    }, function(){
      showToast(t("toast.copyFailed"));
    });
  });

  /* ---------- tempo : saisie directe, ±5, molette, glisser vertical ---------- */
  playBtn.addEventListener("click", togglePlay);
  plus5.addEventListener("click", function(){ setBpm(bpm + 5); });
  minus5.addEventListener("click", function(){ setBpm(bpm - 5); });
  tempoNum.addEventListener("wheel", function(e){
    e.preventDefault();
    setBpm(bpm + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  /* Saisie directe : le champ n'accepte que des chiffres ; Entrée ou perte de
     focus valide (valeur clampée 40–200 par setBpm), Échap annule. Après
     validation, l'affichage est TOUJOURS resynchronisé sur bpm — y compris
     saisie vide ou hors bornes. */
  tempoNum.addEventListener("focus", function(){ tempoNum.select(); });
  tempoNum.addEventListener("click", function(){
    // le mouseup natif replace le caret après le select() du focus : on
    // re-sélectionne tout (sémantique « écraser la valeur »)
    if (document.activeElement === tempoNum) tempoNum.select();
  });
  tempoNum.addEventListener("input", function(){
    var clean = tempoNum.value.replace(/\D/g, "").slice(0, 3);
    if (clean !== tempoNum.value) tempoNum.value = clean;
  });
  tempoNum.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); tempoNum.blur(); }
    else if (e.key === "Escape"){ tempoNum.value = bpm; tempoNum.blur(); }
  });
  tempoNum.addEventListener("blur", function(){
    var v = parseInt(tempoNum.value, 10);
    if (!isNaN(v)) setBpm(v);
    tempoNum.value = bpm;
  });

  /* Glisser vertical pour ajuster ; un simple clic (course < 4 px) laisse le
     focus au champ pour la saisie clavier. Le drag ne s'arme qu'au-delà du
     seuil : il rend alors le focus et capture le pointeur. */
  (function(){
    var armed = false, dragging = false, startY = 0, startBpm = 60;
    tempoNum.addEventListener("pointerdown", function(e){
      armed = true; dragging = false; startY = e.clientY; startBpm = bpm;
    });
    tempoNum.addEventListener("pointermove", function(e){
      if (!armed) return;
      if (!dragging){
        if (Math.abs(e.clientY - startY) < 4) return;
        dragging = true;
        tempoNum.blur();
        tempoNum.setPointerCapture(e.pointerId);
      }
      setBpm(startBpm + Math.round((startY - e.clientY) / 3));
    });
    tempoNum.addEventListener("pointerup", function(){ armed = false; dragging = false; });
    tempoNum.addEventListener("pointercancel", function(){ armed = false; dragging = false; });
  })();

  document.addEventListener("keydown", function(e){
    if (e.code !== "Space") return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "BUTTON" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
    if (drawer.classList.contains("open")) return;
    if (composer.active) return; // en composition, la barre d'espace ne lance pas le lecteur
    e.preventDefault();
    togglePlay();
  });

  /* Resize / rotation : re-render si le découpage doit changer, ou si la
     gravure est à largeur native (staffwidth figé au rendu) ; la grille
     elle-même n'est jamais regénérée. Sinon, simple recalcul de géométrie
     (responsive:"resize" absorbe seul les variations de largeur en 4/ligne). */
  var resizeT = null;
  window.addEventListener("resize", function(){
    clearTimeout(resizeT);
    resizeT = setTimeout(function(){
      if (composer.active) buildComposerOverlays(); // la portée composée se recale sur la nouvelle largeur
      if (measuresPerLine() !== perLine || renderedNarrow) renderScore(false);
      computeLines();
    }, 200);
  });

  /* ---------- restauration d'une grille depuis l'URL ---------- */
  function setPill(containerId, value){
    var box = document.getElementById(containerId);
    box.querySelectorAll("input").forEach(function(inp){ inp.checked = (inp.value === value); });
    box.querySelectorAll(".pill").forEach(function(p){
      p.classList.toggle("checked", p.querySelector("input").checked);
    });
  }

  /* Applique aux réglages l'état décodé du hash (les mêmes variables et classes
     visuelles que les gestionnaires manuels), sans regénérer : la génération
     suit avec la graine imposée. */
  function applyState(st){
    // figures : cases à cocher (état visuel géré en CSS via :checked)
    document.querySelectorAll('input[name="fig"]').forEach(function(inp){
      inp.checked = st.figures.indexOf(inp.value) !== -1;
    });
    // signature / note / mesures : pastilles + variables d'état
    sigPicker.setValue(st.meter);      signature = st.meter;
    setPill("note-pills", st.note);    noteChoice = st.note;
    setPill("mes-pills", st.measures); measuresChoice = st.measures;
    // procédés : cases à cocher, puis grisage selon figures et signature
    document.querySelectorAll("input[name='technique']").forEach(function(inp){
      inp.checked = st.techniques.indexOf(inp.value) !== -1;
    });
    updateTechniqueAvailability();
  }

  /* Le hash peut porter DEUX formats : contenu complet (grille composée) ou
     graine + réglages (grille générée). On détecte lequel — le codec du
     mauvais format rend null — et on rejette silencieusement un lien invalide
     (démarrage normal). */
  function readShareFromHash(){
    if (!window.BassRhythmGenerator) return null;
    var raw = (location.hash || "").replace(/^#/, "");
    if (!raw) return null;
    var comp = window.BassRhythmGenerator.decodeComposed(raw);
    if (comp) return { kind: "composed", state: comp };
    var st = window.BassRhythmGenerator.decodeShare(raw);
    if (st){ applyState(st); return { kind: "seed", state: st }; }
    return null;
  }

  /* ==================================================================== */
  /* Mode Composer — construction manuelle d'une grille (grille composée).  */
  /* ==================================================================== */

  var COMPOSER_FIGS = ["ronde", "blanche", "noire", "croche", "double", "triple", "quadruple"];
  var FIG_NAMES = {
    ronde: "figure.whole", blanche: "figure.half", noire: "figure.quarter", croche: "figure.eighth",
    double: "figure.sixteenth", triple: "figure.thirtySecond", quadruple: "figure.sixtyFourth"
  };
  /* Noms propres des silences (solfège) : chaque silence a son nom, distinct de
     la figure de note de même durée. */
  /* Figures pointées proposées d'emblée en mesure composée : la noire
     pointée et la blanche pointée y sont les valeurs du temps. */
  const DOTTED_NAMES = { blanche: "figure.dottedHalf", noire: "figure.dottedQuarter" };
  var REST_NAMES = {
    ronde: "rest.whole", blanche: "rest.half", noire: "rest.quarter", croche: "rest.eighth",
    double: "rest.sixteenth", triple: "rest.thirtySecond", quadruple: "rest.sixtyFourth"
  };
  var COMPOSER_EPSILON = 1e-6;

  /* Glyphes des figures : on réutilise les images déjà présentes dans les
     réglages (chemin en version dossier, data URI dans le fichier unique) —
     ainsi la palette n'introduit aucune nouvelle référence externe. */
  var FIG_SRC = {};
  document.querySelectorAll(".figs .fig").forEach(function(lbl){
    var inp = lbl.querySelector("input");
    var img = lbl.querySelector("img");
    if (inp && img) FIG_SRC[inp.value] = img.getAttribute("src");
  });

  /* État du Composer. measures : chaque mesure est une liste d'événements
     « riches » { fig, rest, dot, tie, triplet } ; la DERNIÈRE mesure est
     toujours la mesure ouverte (partielle ou vide). L'invariant — toute
     mesure pleine vaut exactement la signature — est rétabli après chaque
     mutation par normalizeComposer(). openTriplet : un triolet est ouvert au
     curseur, ses cases se remplissent aux touches suivantes. La composition
     persiste pendant la session (rouvrir le tiroir ne l'efface pas). */
  var composer = {
    active: false,
    meter: "4/4",
    measures: [[]],
    openTriplet: false,
    families: { silences: false, modif: false },
    selection: null
  };

  var composerBtn = document.getElementById("composer-btn");
  var composerDrawer = document.getElementById("composer-drawer");

  /* ---------- durées et invariant (logique pure) ---------- */
  function composerBeats(){ return Meter.analyzeMeter(composer.meter).beats; }
  function figBeats(fig, dot){
    return window.BassRhythmGenerator.figureBeats(fig, composer.meter, dot);
  }
  function eventDur(ev){ return window.BassRhythmGenerator.eventBeats(ev, composer.meter); }
  function measSum(m){
    var s = 0;
    for (var i = 0; i < m.length; i++) s += eventDur(m[i]);
    return s;
  }
  function openMeasure(){ return composer.measures[composer.measures.length - 1]; }
  function composerRemaining(){ return composerBeats() - measSum(openMeasure()); }
  function fullMeasureCount(){ return composer.measures.length - 1; }
  function lastPlacedEvent(){
    for (var i = composer.measures.length - 1; i >= 0; i--){
      var m = composer.measures[i];
      if (m.length) return m[m.length - 1];
    }
    return null;
  }
  function pendingTie(){
    var e = lastPlacedEvent();
    return !!(e && e.tie && !e.rest);
  }
  function fitsFigure(fig, dot){ return figBeats(fig, !!dot) <= composerRemaining() + COMPOSER_EPSILON; }

  /* Rétablit l'invariant : re-répartit tous les événements en mesures pleines
     (remplissage strict, chaque mesure close pile sur la signature) suivies
     d'une mesure ouverte (le reste, éventuellement vide). Après n'importe
     quelle mutation, l'état reste toujours valide — jamais de mesure à moitié
     pleine gravée de travers. */
  function normalizeComposer(){
    var flat = [];
    var i, j;
    for (i = 0; i < composer.measures.length; i++){
      for (j = 0; j < composer.measures[i].length; j++) flat.push(composer.measures[i][j]);
    }
    var out = [];
    var bar = [];
    var sum = 0;
    var beats = composerBeats();
    for (i = 0; i < flat.length; i++){
      bar.push(flat[i]);
      sum += eventDur(flat[i]);
      if (Math.abs(sum - beats) < COMPOSER_EPSILON){ out.push(bar); bar = []; sum = 0; }
    }
    out.push(bar); // mesure ouverte
    composer.measures = out;
  }

  /* ---------- pose et modificateurs ---------- */
  /* Dans un triolet ouvert, seules passent les figures que permet le
     générateur (tripletFigures : croche ou demi-soupir en /4, noire ou
     soupir en /2), jamais pointées. */
  function tripletAllows(fig, isRest, dot){
    if (dot) return false;
    return window.BassRhythmGenerator.tripletFigures(composer).some(function(f){
      return f.fig === fig && f.rest === !!isRest;
    });
  }
  function inTriplet(){ return window.BassRhythmGenerator.tripletFilled(composer) !== null; }
  function placeFigure(fig, isRest, dot){
    if (inTriplet()){
      if (!tripletAllows(fig, isRest, dot)) return;
      openMeasure().push({ fig: fig, rest: !!isRest, dot: false, tie: false, triplet: true });
      // troisième case remplie : le triolet se ferme seul
      if (window.BassRhythmGenerator.tripletFilled(composer) === 0) composer.openTriplet = false;
    } else {
      // on ne lie pas vers un silence
      if (isRest && pendingTie()) return;
      // ne rentre pas dans la place restante
      if (!fitsFigure(fig, dot)) return;
      openMeasure().push({ fig: fig, rest: !!isRest, dot: !isRest && !!dot, tie: false, triplet: false });
    }
    composer.selection = null;
    normalizeComposer();
    refreshComposer();
  }
  /* Effacer : retire le dernier événement. Sur un triolet ouvert encore vide,
     referme le triolet ; retirer une note d'un triolet complet le rouvre
     (ses cases restantes attendent les touches suivantes). */
  function backspaceComposer(){
    if (window.BassRhythmGenerator.tripletFilled(composer) === 0){
      composer.openTriplet = false;
      composer.selection = null;
      refreshComposer();
      return;
    }
    var ms = composer.measures;
    var open = ms[ms.length - 1];
    if (!open.length){
      if (ms.length === 1) return; // grille vide
      ms.pop();
      open = ms[ms.length - 1];
    }
    const removed = open.pop();
    if (removed.triplet) composer.openTriplet = true;
    composer.selection = null;
    normalizeComposer();
    refreshComposer();
  }
  function clearComposer(){
    composer.measures = [[]];
    composer.openTriplet = false;
    composer.selection = null;
    refreshComposer();
  }
  /* Rend false si l'utilisateur refuse de perdre sa grille : le sélecteur de
     signature revient alors à la précédente. */
  function setComposerMeter(v){
    if (v === composer.meter) return true;
    if (fullMeasureCount() > 0 || openMeasure().length){
      if (!window.confirm(t("composer.confirmMeter"))) return false;
    }
    composer.meter = v;
    composer.measures = [[]];
    composer.openTriplet = false;
    composer.selection = null;
    refreshComposer();
    return true;
  }
  /* Point : allonge la dernière note de moitié (bascule). Liaison : la
     dernière note est liée à la suivante (bascule). Les règles de pose (place
     restante, liaison sur un début de temps) sont des fonctions pures du
     générateur, qui lisent l'état de composition sans le muter. */
  function pointState(){
    const last = lastPlacedEvent();
    return {
      on: !!(last && last.dot),
      disabled: !window.BassRhythmGenerator.canDot(composer)
    };
  }
  function togglePoint(){
    if (!window.BassRhythmGenerator.canDot(composer)) return;
    const last = lastPlacedEvent();
    last.dot = !last.dot;
    normalizeComposer();
    refreshComposer();
  }
  function tieState(){
    const last = lastPlacedEvent();
    return {
      on: !!(last && last.tie),
      disabled: !window.BassRhythmGenerator.canTie(composer)
    };
  }
  function toggleTie(){
    if (!window.BassRhythmGenerator.canTie(composer)) return;
    const last = lastPlacedEvent();
    last.tie = !last.tie;
    refreshComposer();
  }
  /* Triolet : ouvre, en début de temps, un groupe de trois cases ; un
     triolet ouvert encore vide se referme au second appui. Pendant le
     triolet, le bouton reste enfoncé et les autres blocs sont grisés. */
  function tripletState(){
    const G = window.BassRhythmGenerator;
    const filled = G.tripletFilled(composer);
    return {
      on: filled !== null,
      disabled: filled === null ? !G.canOpenTriplet(composer) : filled > 0
    };
  }
  function toggleTriplet(){
    const G = window.BassRhythmGenerator;
    const filled = G.tripletFilled(composer);
    if (filled === 0) composer.openTriplet = false;
    else if (filled === null && G.canOpenTriplet(composer)) composer.openTriplet = true;
    else return;
    composer.selection = null;
    refreshComposer();
  }

  /* ---------- duplication de plage (sélection sur la portée) ---------- */
  function cloneMeasure(m){
    return m.map(function(e){ return { fig: e.fig, rest: e.rest, dot: e.dot, tie: e.tie, triplet: !!e.triplet }; });
  }
  function selectComposerRange(a, b){
    composer.selection = { start: Math.min(a, b), end: Math.max(a, b) };
  }
  function inComposerSel(i){
    return composer.selection && i >= composer.selection.start && i <= composer.selection.end;
  }
  function dupComposerHere(){
    if (!composer.selection) return;
    var s = composer.selection, copies = [], i;
    for (i = s.start; i <= s.end; i++) copies.push(cloneMeasure(composer.measures[i]));
    Array.prototype.splice.apply(composer.measures, [s.end + 1, 0].concat(copies));
    composer.selection = { start: s.end + 1, end: s.end + copies.length };
    normalizeComposer();
    refreshComposer();
  }
  function dupComposerEnd(){
    if (!composer.selection) return;
    var s = composer.selection, copies = [], i;
    for (i = s.start; i <= s.end; i++) copies.push(cloneMeasure(composer.measures[i]));
    var at = fullMeasureCount(); // insérer juste avant la mesure ouverte
    Array.prototype.splice.apply(composer.measures, [at, 0].concat(copies));
    composer.selection = { start: at, end: at + copies.length - 1 };
    normalizeComposer();
    refreshComposer();
  }
  function delComposerSel(){
    if (!composer.selection) return;
    var s = composer.selection;
    composer.measures.splice(s.start, s.end - s.start + 1);
    if (!composer.measures.length) composer.measures = [[]];
    composer.selection = null;
    normalizeComposer();
    refreshComposer();
  }

  /* ---------- gravure en direct (mêmes options que la vue de jeu) ---------- */
  function toDModel(measures){
    return measures.map(function(m){
      return m.map(function(ev){ return { d: eventDur(ev), rest: ev.rest, tie: ev.tie, triplet: !!ev.triplet }; });
    });
  }
  function sumD(m){
    var s = 0;
    for (var i = 0; i < m.length; i++) s += m[i].d;
    return s;
  }
  /* Cases encore vides du triolet ouvert (0 sans triolet ouvert). */
  function openTripletSlots(){
    const filled = window.BassRhythmGenerator.tripletFilled(composer);
    return filled === null ? 0 : 3 - filled;
  }
  function composerAbc(){
    var G = window.BassRhythmGenerator;
    const beats = composerBeats();
    const beat64 = Meter.analyzeMeter(composer.meter).beat64;
    var noteTok = noteByLetter(noteChoice).abc;
    var dModel = toDModel(composer.measures);
    // triolet ouvert : ses cases vides sont gravées en silences du triolet
    // (estompés après la gravure), pour que le chiffre 3 et le crochet
    // s'affichent dès l'ouverture
    const slots = openTripletSlots();
    if (slots){
      const slot = { fig: G.tripletFigure(composer.meter), dot: false, triplet: true };
      for (let k = 0; k < slots; k++){
        dModel[dModel.length - 1].push({ d: eventDur(slot), rest: true, tie: false, triplet: true });
      }
    }
    const unit = G.chooseUnit(dModel, composer.meter);
    var lden = 64 / unit;
    var bars = dModel.map(function(m, mi){
      let t = G.barText(m, unit, composer.meter, noteTok);
      if (mi === dModel.length - 1){
        // mesure ouverte : la partie vide est comblée par un silence invisible
        var rem = beats - sumD(m);
        if (rem > COMPOSER_EPSILON){
          const mu = Math.round(rem * beat64) / unit;
          t = (t ? t + " " : "") + "x" + (mu === 1 ? "" : mu);
        } else if (!t){
          t = "x" + (Math.round(beats * beat64) / unit);
        }
      }
      return t;
    });
    // La mesure ouverte garde une liaison PENDANTE (arc vers le silence
    // invisible) comme repère visuel « la prochaine note sera liée » ; à Jouer,
    // assembleComposed la neutralise (une liaison sans cible ne se joue pas).
    return G.abcHeader(composer.meter, lden) + G.joinBars(bars, composerPerLine());
  }
  function renderComposerStaff(){
    var el = document.getElementById("composer-staff");
    if (!el) return;
    if (!window.ABCJS){
      el.innerHTML = '<div class="score-fallback">' + t("score.unavailable") + '</div>';
      return;
    }
    ABCJS.renderAbc(el, composerAbc(), { add_classes: true, responsive: "resize" });
    // cases vides du triolet ouvert : les derniers silences gravés (le reste
    // de la mesure ouverte est invisible et ne produit aucun élément)
    const slots = openTripletSlots();
    const events = el.querySelectorAll(".abcjs-note, .abcjs-rest");
    for (let k = Math.max(0, events.length - slots); k < events.length; k++){
      events[k].classList.add("triplet-slot");
    }
    // la ligne en travail reste centrée et s'écarte depuis le centre au fur et
    // à mesure du remplissage (même helper que la vue de jeu)
    centerStaffSvg(el.querySelector("svg"));
    buildComposerOverlays();
  }

  /* ---------- zones de sélection + barrette flottante ---------- */
  /* Mesures par système de la portée composée : 4, moins pour une mesure
     longue (même règle que la vue de jeu sur écran large). */
  function composerPerLine(){
    return measuresPerLineFor(composer.meter, false);
  }
  function composerMeasureEls(svg, i){
    var direct = svg.querySelectorAll(".abcjs-mm" + i);
    if (direct.length) return direct;
    const per = composerPerLine();
    const line = Math.floor(i / per);
    const within = i % per;
    return svg.querySelectorAll(".abcjs-l" + line + ".abcjs-m" + within);
  }
  function buildComposerOverlays(){
    var layer = document.getElementById("composer-overlay");
    if (!layer) return;
    layer.innerHTML = "";
    var svg = document.querySelector("#composer-staff svg");
    if (!svg) return;
    var base = layer.getBoundingClientRect();
    for (var i = 0; i < fullMeasureCount(); i++){
      var els = composerMeasureEls(svg, i);
      if (!els.length) continue;
      var l = 1e9, r = -1e9, t = 1e9, b = -1e9;
      els.forEach(function(e){
        var bb = e.getBoundingClientRect();
        l = Math.min(l, bb.left); r = Math.max(r, bb.right);
        t = Math.min(t, bb.top); b = Math.max(b, bb.bottom);
      });
      var z = document.createElement("div");
      z.className = "measure-zone" + (inComposerSel(i) ? " sel" : "");
      z.dataset.mm = i;
      z.style.left = (l - base.left - 5) + "px";
      z.style.width = (r - l + 10) + "px";
      z.style.top = (t - base.top - 6) + "px";
      z.style.height = (b - t + 12) + "px";
      layer.appendChild(z);
    }
    placeComposerFloatbar();
  }
  function placeComposerFloatbar(){
    var host = document.getElementById("composer-stage");
    if (!host) return;
    var old = host.querySelector(".float-bar");
    if (old) old.remove();
    if (!composer.selection) return;
    var sel = [].slice.call(document.querySelectorAll("#composer-overlay .measure-zone.sel"));
    if (!sel.length) return;
    var l = 1e9, r = -1e9, t = 1e9;
    sel.forEach(function(e){
      var bb = e.getBoundingClientRect();
      l = Math.min(l, bb.left); r = Math.max(r, bb.right); t = Math.min(t, bb.top);
    });
    var hb = host.getBoundingClientRect();
    var n = composer.selection.end - composer.selection.start + 1;
    var atEnd = composer.selection.end === fullMeasureCount() - 1;
    var bar = document.createElement("div");
    bar.className = "float-bar";
    bar.innerHTML =
      '<span class="float-bar-label">' + t(n > 1 ? "composer.measureMany" : "composer.measureOne", { count: n }) + '</span>' +
      '<button type="button" data-cact="dup-here">' + t("composer.duplicateRight") + '</button>' +
      (atEnd ? "" : '<button type="button" data-cact="dup-end">' + t("composer.duplicateEnd") + '</button>') +
      '<span class="sep"></span>' +
      '<button type="button" data-cact="del">' + t("action.delete") + '</button>';
    bar.style.left = Math.max(120, (l + r) / 2 - hb.left) + "px";
    bar.style.top = (t - hb.top) + "px";
    host.appendChild(bar);
  }
  function updateComposerSelectionVisual(){
    document.querySelectorAll("#composer-overlay .measure-zone").forEach(function(z){
      z.classList.toggle("sel", inComposerSel(+z.dataset.mm));
    });
    placeComposerFloatbar();
  }

  /* ---------- fragments du tiroir ---------- */
  function setHTMLById(id, html){
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }
  function composerFamiliesHTML(){
    var f = composer.families;
    return '<button type="button" class="fam on" data-cfam="notes" aria-pressed="true" disabled>' + t("family.notes") + '</button>' +
      '<button type="button" class="fam' + (f.silences ? " on" : "") + '" data-cfam="silences" aria-pressed="' + f.silences + '">' + t("family.rests") + '</button>' +
      '<button type="button" class="fam' + (f.modif ? " on" : "") + '" data-cfam="modif" aria-pressed="' + f.modif + '">' + t("family.modifiers") + '</button>';
  }
  /* Glyphe de silence : la palette n'a pas d'images de silence (seulement des
     notes) ; on grave le vrai symbole de repos avec abcjs — le même moteur que
     la portée — puis on retire les lignes de portée et on resserre le viewBox
     sur le seul glyphe. Rendu une fois par figure, mémoïsé. Aucune ressource
     externe ajoutée : abcjs est déjà embarqué. */
  var restGlyphCache = {};
  function restGlyphSvg(fig){
    if (restGlyphCache.hasOwnProperty(fig)) return restGlyphCache[fig];
    var svg = "";
    if (window.ABCJS && window.BassRhythmGenerator){
      const n64 = window.BassRhythmGenerator.FIGURE_64[fig];
      var tmp = document.createElement("div");
      tmp.style.cssText = "position:absolute;left:-9999px;top:0";
      document.body.appendChild(tmp);
      try {
        window.ABCJS.renderAbc(tmp, "X:1\nL:1/64\nK:C clef=none\nz" + n64, { add_classes: true });
        var s = tmp.querySelector("svg");
        if (s){
          s.querySelectorAll(".abcjs-staff, style, title").forEach(function(e){ e.remove(); });
          var rest = s.querySelector(".abcjs-rest");
          if (rest){
            var bb = rest.getBBox();
            var pad = 4;
            s.setAttribute("viewBox", (bb.x - pad) + " " + (bb.y - pad) + " " + (bb.width + pad * 2) + " " + (bb.height + pad * 2));
            s.setAttribute("preserveAspectRatio", "xMidYMid meet");
            s.removeAttribute("width");
            s.removeAttribute("height");
            svg = s.outerHTML;
          }
        }
      } catch (e){ svg = ""; }
      document.body.removeChild(tmp);
    }
    restGlyphCache[fig] = svg;
    return svg;
  }
  function composerItemHTML(fig, isRest, dot){
    const ok = inTriplet()
      ? tripletAllows(fig, isRest, dot)
      : fitsFigure(fig, dot) && !(isRest && pendingTie());
    const image = "<img class=\"palette-glyph\" src=\"" + (FIG_SRC[fig] || "") + "\" alt=\"\">";
    var glyph = isRest
      ? '<span class="palette-glyph palette-rest">' + restGlyphSvg(fig) + '</span>'
      : (dot ? "<span class=\"palette-dotted\">" + image + "<span class=\"palette-dot\"></span></span>" : image);
    const label = t(isRest ? REST_NAMES[fig] : (dot ? DOTTED_NAMES[fig] : FIG_NAMES[fig]));
    return '<button type="button" class="palette-item" data-cfig="' + fig + '" data-crest="' + isRest + '"' +
      " data-cdot=\"" + !!dot + "\"" +
      (ok ? "" : " disabled") + '>' +
      glyph +
      '<span class="palette-label">' + label + '</span></button>';
  }
  /* Notes de la palette : en mesure composée, la blanche pointée et la noire
     pointée précèdent leur figure simple. */
  function composerNoteItems(){
